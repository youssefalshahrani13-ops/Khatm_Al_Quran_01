<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> مراجعة </title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #d4af37;
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #e0e0e0;
            --success: #2ecc71;
            --error: #e74c3c;
        }

        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 { color: var(--primary-color); margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 25px; font-size: 0.9em; }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 1em;
            color: #bbb;
            padding: 0 10px;
        }

        .word-display {
            font-size: 2.2em;
            font-weight: 600;
            margin-bottom: 30px;
            padding: 30px;
            background: #252525;
            border-radius: 10px;
            border: 1px solid #3d3d3d;
        }

        .options-grid {
            display: grid;
            gap: 15px;
        }

        button {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            background: #3d3d3d;
            color: white;
            border: 2px solid transparent;
            padding: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            transition: all 0.2s ease;
            text-align: right;
        }

        button:hover:not(:disabled) {
            background: #4d4d4d;
            border-color: var(--primary-color);
        }

        button.correct { background-color: var(--success) !important; color: white; border-color: #27ae60; }
        button.wrong { background-color: var(--error) !important; color: white; border-color: #c0392b; }

        .result-screen { display: none; padding: 40px 0; }
        .btn-restart {
            margin-top: 30px;
            background: var(--primary-color);
            color: #000;
            font-weight: bold;
            width: 200px;
            text-align: center;
        }

        #progress-bar-container {
            width: 100%;
            height: 8px;
            background: #3d3d3d;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        #progress-bar {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.4s ease;
        }
    </style>
</head>
<body>

<div class="container" id="quiz-container">
    <h1>مراجعة معاني الكلمات</h1>
    <p class="subtitle"></p>
    
    <div id="progress-bar-container">
        <div id="progress-bar"></div>
    </div>

    <div class="quiz-header">
        <span id="score-display">النقاط: 0</span>
        <span id="counter-display">السؤال: 1 / 95</span>
    </div>

    <div id="game-ui">
        <div class="word-display" id="current-word">جاري التحميل...</div>
        <div class="options-grid" id="options-container"></div>
    </div>

    <div class="result-screen" id="result-screen">
        <h2>ممتاز</h2>
        <p style="font-size: 1.2em; color: #bbb;">لقد أتممت الاختبار بالكامل</p>
        <div id="final-score" style="font-size: 2.5em; font-weight: bold; color: var(--primary-color); margin: 20px 0;"></div>
        <button class="btn-restart" onclick="location.reload()">إعادة الاختبار من جديد</button>
    </div>
</div>

        { w: "مَوَاخِرَ فِيهِ", d: "تَشُقُّ الْمَاءَ بِجَرْيِهَا فِيهِ ذَهَابًا وَرُجُوعًا" },
        { w: "عَلَى تَخَوُّفٍ", d: "عَلَى تَنَقُّصٍ شَيْئًا فَشَيْئًا فِي الْأَمْوَالِ وَالْأَنْفُسِ وَالثَّمَرَاتِ حَتَّى يَهْلِكُوا أَوْ عَلَى مَخَافَةٍ مِنَ الْعَذَابِ" },
        { w: "وَلَا عَادٍ", d: "وَلَا مُتَجَاوِزٍ مَا يَسُدُّ جَوْعَتَهُ" },
        { w: "خِلَالَ الدِّيَارِ", d: "وَسَطَهَا بِالْإِفْسَادِ" },
        { w: "وَلَا تَقْفُ", d: "لَا تَتَّبِعْ" },
        { w: "أَكِنَّة", d: "أَغْطِيَةٌ" },
        { w: "خِلَافَكَ", d: "بَعْدَكَ" },
        { w: "قَتُورًا", d: "بَخِيلًا مَنُوعًا" }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let shuffledDictionary = [];

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function initGame() {
        shuffledDictionary = shuffle([...dictionary]);
        currentQuestionIndex = 0;
        score = 0;
        updateUI();
        showQuestion();
    }

    function showQuestion() {
        const question = shuffledDictionary[currentQuestionIndex];
        document.getElementById('current-word').textContent = question.w;
        
        // توليد خيارات من التعريفات الأخرى الموجودة في القائمة
        let options = [question.d];
        while (options.length < 4) {
            let randomIdx = Math.floor(Math.random() * dictionary.length);
            let randomDef = dictionary[randomIdx].d;
            if (!options.includes(randomDef)) {
                options.push(randomDef);
            }
        }
        options = shuffle(options);

        const container = document.getElementById('options-container');
        container.innerHTML = '';
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.textContent = opt;
            btn.onclick = () => checkAnswer(opt, question.d, btn);
            container.appendChild(btn);
        });

        document.getElementById('counter-display').textContent = `السؤال: ${currentQuestionIndex + 1} / ${shuffledDictionary.length}`;
        const progress = ((currentQuestionIndex) / shuffledDictionary.length) * 100;
        document.getElementById('progress-bar').style.width = `${progress}%`;
    }

    function checkAnswer(selected, correct, btn) {
        const buttons = document.querySelectorAll('#options-container button');
        buttons.forEach(b => b.disabled = true);

        if (selected === correct) {
            score++;
            btn.classList.add('correct');
        } else {
            btn.classList.add('wrong');
            buttons.forEach(b => {
                if (b.textContent === correct) b.classList.add('correct');
            });
        }

        setTimeout(() => {
            currentQuestionIndex++;
            if (currentQuestionIndex < shuffledDictionary.length) {
                showQuestion();
                updateUI();
            } else {
                showResults();
            }
        }, 1000);
    }

    function updateUI() {
        document.getElementById('score-display').textContent = `النقاط: ${score}`;
    }

    function showResults() {
        document.getElementById('game-ui').style.display = 'none';
        document.getElementById('quiz-header')?.style.setProperty('display', 'none');
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('progress-bar').style.width = '100%';
        document.getElementById('final-score').textContent = `${score} / ${dictionary.length}`;
    }

    initGame();
</script>

</body>
